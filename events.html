  <style>
    /* --- 🌟 Featured Poster Banner --- */
    .events-poster-section {
      display: flex;
      justify-content: center;
      margin: 1rem auto 2.5rem;
      padding: 0 1.5rem;
      width: 100%;
    }
    .events-poster-container {
      max-width: 720px;
      width: auto;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(246, 210, 138, 0.3);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(246, 210, 138, 0.06);
      background: #0a0a0a;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 0.4s ease;
      position: relative;
    }
    .events-poster-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(246, 210, 138, 0.12);
      border-color: rgba(246, 210, 138, 0.5);
    }
    .events-featured-img {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 380px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }

    /* --- 🌟 Section Divider --- */
    .events-section-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      max-width: 1100px;
      margin: 0 auto 2.2rem;
      padding: 0 1.5rem;
    }
    .events-header-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246, 210, 138, 0.3), transparent);
    }
    .events-section-title {
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 2px;
      margin: 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- 🌟 Horizontal Event Strip List (Reference Design) --- */
    #eventsContainer.events-strip-container {
      max-width: 1100px;
      margin: 0 auto 5rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .event-strip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.8rem 1.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      position: relative;
      background: transparent;
      gap: 2rem;
      text-decoration: none;
    }

    .event-strip-row:first-child {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .event-strip-row:hover {
      background: rgba(255, 255, 255, 0.035);
    }

    /* Left: Date Block */
    .event-date-block {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 150px;
      flex-shrink: 0;
    }

    .event-day {
      font-family: var(--font-display), 'Noto Sans SC', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      letter-spacing: 1px;
    }

    .event-month-year {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.25;
    }

    .event-month {
      font-size: 0.95rem;
      font-weight: 500;
      color: #ddd;
      letter-spacing: 1px;
    }

    .event-year {
      font-size: 0.8rem;
      color: #777;
      letter-spacing: 1px;
    }

    /* Center: Event Info Block */
    .event-info-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .event-strip-title {
      font-size: 1.22rem;
      font-weight: 500;
      color: #fff;
      margin: 0;
      line-height: 1.4;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .event-strip-title a {
      color: #fff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .event-strip-title a:hover {
      color: var(--gold);
    }

    .event-strip-venue {
      font-size: 0.85rem;
      color: #888;
      margin: 0;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Status Tags */
    .event-tag-sold-out {
      color: #ff6b81;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .event-tag-cancelled {
      color: #a4b0be;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .event-tag-open {
      color: #2ed573;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Right: Action Block */
    .event-action-block {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: flex-end;
      flex-shrink: 0;
      min-width: 220px;
    }

    .event-strip-link {
      font-size: 0.9rem;
      color: #eee;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      padding-bottom: 3px;
      transition: all 0.25s ease;
      white-space: nowrap;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .event-strip-link:hover {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .event-strip-disabled {
      font-size: 0.9rem;
      color: #666;
      border-bottom: none;
      cursor: default;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .btn-strip-remind {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #888;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .btn-strip-remind:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(246,210,138,0.1);
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .events-poster-section { margin-bottom: 1.8rem; }
      .event-strip-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
        padding: 1.4rem 1rem;
      }
      .event-info-block {
        width: 100%;
      }
      .event-strip-venue {
        white-space: normal;
      }
      .event-action-block {
        width: 100%;
        justify-content: flex-end;
        gap: 16px;
        padding-top: 6px;
        min-width: auto;
      }
      .event-action-block .event-strip-link,
      .event-action-block .event-strip-disabled {
        margin-right: auto;
      }
    }
  </style>
