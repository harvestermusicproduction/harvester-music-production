  <style>
    /* --- 🌟 Featured Poster Banner (Compact & Natural Proportions) --- */
    .events-poster-section {
      display: flex;
      justify-content: center;
      margin: 1rem auto 2.2rem;
      padding: 0 1.5rem;
      width: 100%;
    }
    .events-poster-container {
      max-width: 680px;
      width: auto;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(246, 210, 138, 0.3);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(246, 210, 138, 0.06);
      background: #0a0a0a;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 0.4s ease;
      position: relative;
    }
    .events-poster-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(246, 210, 138, 0.12);
      border-color: rgba(246, 210, 138, 0.5);
    }
    .events-featured-img {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 360px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }

    /* --- 🌟 Section Divider --- */
    .events-section-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      max-width: 1100px;
      margin: 0 auto 1.8rem;
      padding: 0 1.5rem;
    }
    .events-header-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246, 210, 138, 0.3), transparent);
    }
    .events-section-title {
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 2px;
      margin: 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- 🌟 Horizontal Grid of Events --- */
    #eventsContainer.events-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2.2rem;
      max-width: 1200px;
      margin: 0 auto 5rem;
      padding: 0 1.5rem;
    }

    /* --- 🌟 Event Card (Horizontal Row Item) --- */
    .event-card-item {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .event-card-item:hover {
      transform: translateY(-6px);
      border-color: rgba(246, 210, 138, 0.4);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(246, 210, 138, 0.1);
      background: rgba(25, 25, 25, 0.9);
    }
    .event-card-img-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      display: block;
      position: relative;
    }
    .event-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .event-card-item:hover .event-card-img {
      transform: scale(1.05);
    }
    .event-card-body {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .event-meta-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #bbb;
    }
    .event-meta-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .event-meta-pill i {
      color: var(--gold);
      width: 16px;
      text-align: center;
      font-size: 0.85rem;
    }
    .event-card-title {
      font-size: 1.35rem;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .event-card-title a {
      color: #fff;
      transition: color 0.3s ease;
      text-decoration: none;
    }
    .event-card-title a:hover {
      color: var(--gold);
    }
    .event-card-desc {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .event-card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-event-detail {
      flex: 1;
      padding: 10px 14px;
      background: rgba(246, 210, 138, 0.12);
      border: 1px solid rgba(246, 210, 138, 0.3);
      color: var(--gold);
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .btn-event-detail:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .btn-event-remind {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ddd;
      border-radius: 50px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .btn-event-remind:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .events-poster-section { margin-bottom: 2rem; }
      #eventsContainer.events-grid-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .events-section-title { font-size: 1.1rem; }
    }
  </style>
