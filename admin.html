<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Safari / iOS BFCache Buster: If page is restored from memory cache or back-forward navigation, force reload

  <title>CMS 后台管理 · Harvester Music</title>
  <link rel="stylesheet" href="styles.css?v=71.0.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gold: #FFB830 !important;
      --gold-light: #FFD166 !important;
      --gold-dark: #E09612 !important;
      --gold-glow: rgba(255, 184, 48, 0.38) !important;
      --gold-bg: rgba(255, 184, 48, 0.14) !important;
      --gold-border: rgba(255, 184, 48, 0.42) !important;
      --admin-coral: #FF6B4A;
      --admin-red: #FF4757;
      --admin-red-light: #ff6b81;
      --admin-red-dark: #e03140;
      --admin-red-glow: rgba(255, 71, 87, 0.35);
      --admin-red-bg: rgba(255, 71, 87, 0.12);
      --admin-red-border: rgba(255, 71, 87, 0.42);
      --admin-bg-darkest: #18110D;
      --admin-bg-dark: #211712;
      --admin-bg-card: #2B1E17;
      --admin-bg-input: #1D140F;
      --admin-border: #4A3326;
      --admin-text-main: #FFF8F0;
      --admin-text-sub: #E6D5C3;
      --admin-text-muted: #B89F88;
    }

    body {
      background: radial-gradient(circle at 15% 20%, rgba(255, 107, 74, 0.16) 0%, transparent 45%), radial-gradient(circle at 85% 25%, rgba(255, 184, 48, 0.18) 0%, transparent 50%), linear-gradient(160deg, #1E1510 0%, #2B1D16 55%, #160F0B 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      overflow: hidden;
      color: var(--admin-text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    label {
      color: var(--admin-text-muted);
    }

    .auth-container {
      background: linear-gradient(145deg, #2B1E17 0%, #211712 100%);
      border: 1.5px solid var(--gold-border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 18px 50px rgba(15, 9, 5, 0.85), 0 0 35px rgba(255, 184, 48, 0.16);
      position: relative;
      z-index: 10;
      text-align: center;
      transition: all 0.5s ease;
    }
    .auth-container.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      pointer-events: none;
    }
    .auth-title {
      font-family: var(--font-brand), sans-serif;
      color: var(--admin-text-main);
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 2rem;
    }
    .auth-title span {
      color: var(--gold);
    }
    .auth-input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .auth-input-group label {
      display: block;
      color: var(--admin-text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .auth-input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--admin-bg-input);
      border: 1px solid var(--admin-border);
      color: var(--admin-text-main);
      border-radius: 6px;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }
    .auth-input-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
      outline: none;
    }
    .auth-error {
      color: var(--admin-red-light);
      background: var(--admin-red-bg);
      border: 1px solid var(--admin-red-border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    /* Primary Positive Actions (Sunlit Harvest Gold -> Coral Gradient) */
    .btn-login, .btn-submit, .btn-primary, .btn-submit-cms {
      width: 100%;
      background: linear-gradient(135deg, #FFB830 0%, #FF6B4A 100%) !important;
      color: #1A110B !important;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 107, 74, 0.35);
      transition: all 0.25s ease;
    }
    .btn-login:hover, .btn-submit:hover, .btn-primary:hover, .btn-submit-cms:hover {
      background: linear-gradient(135deg, #FFD166 0%, #FF8266 100%) !important;
      color: #120B07 !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(255, 107, 74, 0.5), 0 0 18px rgba(255, 184, 48, 0.35);
    }
    .btn-login:active, .btn-submit:active, .btn-primary:active, .btn-submit-cms:active {
      transform: translateY(1px);
    }

    /* Secondary / Tiny Buttons */
    .btn-tiny {
      padding: 6px 14px;
      background: #241913;
      border: 1px solid var(--admin-border);
      color: var(--admin-text-sub);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-tiny:hover {
      border-color: var(--gold);
      color: var(--admin-text-main);
      background: rgba(255, 184, 48, 0.16);
    }

    /* Destructive Actions (Strictly Admin Red #FF4757) */
    .btn-tiny.danger, .btn.danger, button.danger {
      color: #FF6B81;
      border-color: rgba(255, 71, 87, 0.45);
      background: rgba(255, 71, 87, 0.1) !important;
    }
    .btn-tiny.danger:hover, .btn.danger:hover, button.danger:hover {
      background: var(--admin-red) !important;
      border-color: var(--admin-red) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px var(--admin-red-glow);
    }

    .btn-home {
      display: block;
      margin-top: 1.5rem;
      color: var(--admin-text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn-home:hover {
      color: var(--gold);
    }

    /* CMS Layout & Sidebar Navigation */
    .cms-layout {
      display: flex;
      height: 100vh;
      background: transparent;
      color: var(--admin-text-main);
      overflow: hidden;
      position: relative;
    }
    .cms-sidebar {
      width: 265px;
      min-width: 265px;
      background: linear-gradient(180deg, #211712 0%, #18110D 100%);
      border-right: 1px solid var(--admin-border);
      padding: 1.8rem 1.1rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-section-title {
      font-size: 0.65rem;
      color: var(--admin-text-muted);
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin: 10px 0 6px 8px;
      font-weight: 700;
    }
    .cms-layout aside nav a,
    .nav-item {
      color: var(--admin-text-sub);
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }
    .cms-layout aside nav a:hover,
    .nav-item:hover {
      background: rgba(255, 184, 48, 0.1);
      color: var(--admin-text-main);
    }
    .nav-item.active {
      background: linear-gradient(90deg, rgba(255, 184, 48, 0.22), rgba(255, 107, 74, 0.12));
      color: #FFB830;
      font-weight: 600;
      border-left: 3px solid #FFB830;
    }

    .cms-card {
      background: var(--admin-bg-card);
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 6px 24px rgba(15, 9, 5, 0.55);
    }

    input[type="text"], input[type="file"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], select, textarea {
      padding: 10px 12px;
      background: var(--admin-bg-input) !important;
      border: 1px solid var(--admin-border) !important;
      color: var(--admin-text-main) !important;
      border-radius: 6px !important;
      margin-top: 5px;
      box-sizing: border-box;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold) !important;
      box-shadow: 0 0 10px var(--gold-glow) !important;
      outline: none !important;
    }

    #adminDashboard {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 15% 20%, rgba(255, 107, 74, 0.16) 0%, transparent 45%), radial-gradient(circle at 85% 25%, rgba(255, 184, 48, 0.18) 0%, transparent 50%), linear-gradient(160deg, #1E1510 0%, #2B1D16 55%, #160F0B 100%);
      z-index: 20;
      display: none;
    }
    #adminDashboard.active {
      display: block;
    }

    /* Mobile Header & Drawer Overlay */
    .cms-mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #211712;
      border-bottom: 1px solid var(--admin-border);
      z-index: 90;
    }
    .cms-sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18, 11, 7, 0.72);
      backdrop-filter: blur(3px);
      z-index: 95;
    }
    .cms-sidebar-overlay.active {
      display: block;
    }

    /* Non-Blocking Toast Notification System */
    #adminToastContainer {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      width: calc(100% - 40px);
      pointer-events: none;
    }
    .admin-toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 10px;
      background: rgba(43, 30, 23, 0.96);
      backdrop-filter: blur(12px);
      color: var(--admin-text-main);
      font-size: 0.86rem;
      line-height: 1.45;
      box-shadow: 0 10px 30px rgba(15, 9, 5, 0.78);
      border: 1px solid var(--admin-border);
      border-left: 4px solid var(--gold);
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }
    .admin-toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .admin-toast.success {
      border-left-color: var(--gold);
    }
    .admin-toast.error {
      border-left-color: var(--admin-red);
      background: rgba(48, 20, 22, 0.96);
    }
    .admin-toast.info {
      border-left-color: var(--admin-coral);
    }

    /* Responsive Mobile & Tablet Styles (< 900px) */
    @media (max-width: 900px) {
      .cms-layout {
        flex-direction: column;
      }
      .cms-mobile-header {
        display: flex;
      }
      .cms-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100vh;
        transform: translateX(-100%);
        box-shadow: 10px 0 35px rgba(0, 0, 0, 0.85);
      }
      .cms-sidebar.open {
        transform: translateX(0);
      }
      #moduleBody {
        padding: 1.25rem 1rem !important;
      }
      .cms-card {
        padding: 1.25rem !important;
      }
      #moduleBody [style*="grid-template-columns: 1fr 1fr"],
      #moduleBody [style*="grid-template-columns:1fr 1fr"],
      #moduleBody [style*="grid-template-columns: 1.2fr 1fr"],
      #moduleBody [style*="grid-template-columns: 2fr 1fr"],
      #moduleBody [style*="grid-template-columns: 240px 1fr"],
      div[id$="Modal"] [style*="grid-template-columns: 1fr 1fr"],
      div[id$="Modal"] [style*="grid-template-columns: 1fr 1fr 1fr"],
      div[id$="Modal"] [style*="grid-template-columns: 2fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="authLoading" style="position:fixed; z-index:999; color:var(--gold); font-family:var(--font-brand), sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:1px;">
    验证身份中 (Authenticating)...
  </div>

  <!-- Non-Blocking Toast Container -->
  <div id="adminToastContainer" aria-live="polite"></div>

  <!-- Login Form -->
  <div class="auth-container hidden" id="loginBox">
    <div class="auth-title">System <span>Admin</span></div>
    <form id="loginForm">
      <div class="auth-input-group">
        <label>Email Address</label>
        <input type="email" id="txtEmail" required placeholder="admin@domain.com">
      </div>
      <div class="auth-input-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" id="txtPassword" required placeholder="••••••••" style="padding-right: 40px;">
          <i class="fa-solid fa-eye" id="togglePassword" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#a0a0a0; cursor:pointer;"></i>
        </div>
      </div>
      <div class="auth-error" id="loginError">账号或密码错误 (Invalid Credentials)</div>
      <button type="submit" class="btn-login" id="btnLogin">授权进入 (Login)</button>
    </form>
    <div style="display:flex; justify-content:center; margin-top:1.5rem;">
      <a href="index.html" class="btn-home">← 返回主页 (Back to Home)</a>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="adminDashboard"></div>

  <!-- Scripts -->
  <script>
    // 强制保险：如果 5 秒后还在加载，强行显示登录框
    (function() {
      console.log("Admin: Standby Fail-safe Initialized...");
      setTimeout(function() {
        var loader = document.getElementById('authLoading');
        var login = document.getElementById('loginBox');
        if (loader && loader.style.display !== 'none') {
          console.warn("Admin: Boot timeout, forcing UI...");
          loader.style.display = 'none';
          if (login) login.classList.remove('hidden');
        }
      }, 5000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="config.js?v=20261022_ga"></script>
  <script src="admin.js?v=71.0.0"></script>
</body>
</html>
