<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <link rel="preload" href="assets/fonts/ChenYuluoyan-SC.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS 后台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Montserrat:wght@800;900&family=Archivo+Black&family=Anton&family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Kalam:wght@700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=53.0.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --admin-red: #e63946;
      --admin-red-light: #ff4d4f;
      --admin-red-dark: #c92a3f;
      --admin-red-glow: rgba(230, 57, 70, 0.35);
      --admin-red-bg: rgba(230, 57, 70, 0.12);
      --admin-red-border: rgba(230, 57, 70, 0.38);
      --admin-bg-darkest: #070707;
      --admin-bg-dark: #0f0f0f;
      --admin-bg-card: #141414;
      --admin-bg-input: #1a1a1a;
      --admin-text-main: #ffffff;
      --admin-text-sub: #dedede;
      --admin-text-muted: #888888;
      --admin-border: #242424;
      --gold: #e63946 !important;
      --gold-glow: rgba(230, 57, 70, 0.35) !important;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #180f11 0%, #080808 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      overflow: hidden;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    .auth-container {
      background: #111111;
      border: 1.5px solid rgba(230, 57, 70, 0.4);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 30px rgba(230, 57, 70, 0.12);
      position: relative;
      z-index: 10;
      text-align: center;
      transition: all 0.5s ease;
    }
    .auth-container.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      pointer-events: none;
    }
    .auth-title {
      font-family: var(--font-brand), sans-serif;
      color: #ffffff;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 2rem;
    }
    .auth-title span {
      color: var(--admin-red);
    }
    .auth-input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .auth-input-group label {
      display: block;
      color: #aaaaaa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .auth-input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333333;
      color: #ffffff;
      border-radius: 6px;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }
    .auth-input-group input:focus {
      border-color: var(--admin-red);
      box-shadow: 0 0 12px var(--admin-red-glow);
      outline: none;
    }
    .auth-error {
      color: #ff4d4f;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .btn-login, .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #e63946 0%, #c92a3f 100%);
      color: #ffffff;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(230, 57, 70, 0.4);
      transition: all 0.3s ease;
    }
    .btn-login:hover, .btn-submit:hover {
      background: #ff4d4f;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(230, 57, 70, 0.6);
    }
    .btn-login:active, .btn-submit:active {
      transform: translateY(1px);
    }
    
    .btn-tiny {
      padding: 6px 14px;
      background: #1a1a1a;
      border: 1px solid #333333;
      color: #cccccc;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-tiny:hover {
      border-color: var(--admin-red);
      color: #ffffff;
      background: rgba(230, 57, 70, 0.15);
    }

    .btn-tiny.danger {
      color: #ff6b6b;
      border-color: rgba(230, 57, 70, 0.4);
    }
    .btn-tiny.danger:hover {
      background: #e63946;
      border-color: #e63946;
      color: #ffffff;
    }
    
    .btn-home {
      display: block;
      margin-top: 1.5rem;
      color: #888888;
      font-size: 0.82rem;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn-home:hover {
      color: var(--admin-red);
    }
    
    /* CMS Layout styles */
    .cms-layout aside nav a {
      font-size: 0.88rem;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.25s;
      display: block;
      margin-bottom: 5px;
    }
    .cms-layout aside nav a:hover {
      background: rgba(255,255,255,0.06);
    }
    
    input[type="text"], input[type="file"], input[type="number"], select, textarea {
      padding: 10px 12px;
      background: #141414 !important;
      border: 1px solid #2e2e2e !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      margin-top: 5px;
      box-sizing: border-box;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--admin-red) !important;
      box-shadow: 0 0 10px var(--admin-red-glow) !important;
      outline: none !important;
    }

    #adminDashboard {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #080808;
      z-index: 20;
      display: none;
    }
    #adminDashboard.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="authLoading" style="position:fixed; z-index:999; color:var(--admin-red); font-family:var(--font-brand), sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:1px;">
    验证身份中 (Authenticating)...
  </div>

  <!-- Login Form -->
  <div class="auth-container hidden" id="loginBox">
    <div class="auth-title">System Admin</div>
    <form id="loginForm">
      <div class="auth-input-group">
        <label>Email Address</label>
        <input type="email" id="txtEmail" required placeholder="admin@domain.com">
      </div>
      <div class="auth-input-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" id="txtPassword" required placeholder="••••••••" style="padding-right: 40px;">
          <i class="fa-solid fa-eye" id="togglePassword" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#666; cursor:pointer;"></i>
        </div>
      </div>
      <div class="auth-error" id="loginError">账号或密码错误 (Invalid Credentials)</div>
      <button type="submit" class="btn-login" id="btnLogin">授权进入 (Login)</button>
    </form>
    <div style="display:flex; justify-content:center; margin-top:1.5rem;">
      <a href="index.html" class="btn-home">← 返回主页 (Back to Home)</a>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="adminDashboard"></div>

  <!-- Scripts -->
  <script>
    // 强制保险：如果 5 秒后还在加载，强行显示登录框
    (function() {
      console.log("Admin: Standby Fail-safe Initialized...");
      setTimeout(function() {
        var loader = document.getElementById('authLoading');
        var login = document.getElementById('loginBox');
        if (loader && loader.style.display !== 'none') {
          console.warn("Admin: Boot timeout, forcing UI...");
          loader.style.display = 'none';
          if (login) login.classList.remove('hidden');
        }
      }, 5000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="config.js?v=22.0.0"></script>
  <script src="admin.js?v=65.0.0"></script>
</body>
</html>
